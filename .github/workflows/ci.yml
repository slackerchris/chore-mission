name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check server.js
      - name: Smoke test
        run: |
          set -e
          export DATA_DIR="$(mktemp -d)" PORT=8080
          node server.js & pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ | grep -q "Chore Mission"
          curl -fsS http://127.0.0.1:8080/api/col/setup | grep -q '"id":"main"'
          curl -fsS http://127.0.0.1:8080/api/balance | grep -q '"spins":'
