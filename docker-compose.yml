services:
  chores:
    image: ghcr.io/slackerchris/chore-mission:latest
    # build: .   # uncomment to build locally instead of pulling
    container_name: chore-mission
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - TZ=${TZ:-America/New_York}
      - FAMILY_PASSWORD=${FAMILY_PASSWORD:?set FAMILY_PASSWORD in .env}
