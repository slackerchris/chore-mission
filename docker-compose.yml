services:
  chores:
    image: ghcr.io/slackerchris/chore-mission:latest
    # build: .   # uncomment to build locally instead of pulling
    container_name: chore-mission
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - TZ=America/New_York
      - FAMILY_PASSWORD=${FAMILY_PASSWORD:?set FAMILY_PASSWORD in .env}
